<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oflayn — IDU Platform</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(155deg, #0e1b34 0%, #234991 60%, #1d3c78 100%);
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      .mark { position: relative; display: inline-block; margin-bottom: 20px; }
      .idu { font-size: 56px; font-weight: 800; letter-spacing: -3px; }
      .dot { position: absolute; top: -2px; left: 2px; width: 15px; height: 15px; background: #e2092f; border-radius: 3px; }
      h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
      p { color: rgba(255,255,255,0.75); max-width: 320px; line-height: 1.5; }
      button {
        margin-top: 24px; padding: 12px 24px; border: none; border-radius: 10px;
        background: #e2092f; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark"><span class="idu">IDU</span><span class="dot"></span></div>
      <h1>Internet aloqasi yo'q</h1>
      <p>Ulanishni tekshiring. Aloqa tiklangach, sahifa avtomatik yangilanadi.</p>
      <button onclick="location.reload()">Qayta urinish</button>
    </div>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
